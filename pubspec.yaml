name: dastorytella_reader
description: "Mobile ebook reader with punctuation-aware, tone-adaptive text-to-speech and offline voice support."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management (see ARCHITECTURE.md §2, ADR-0004) and navigation
  # (ADR-0005) — the two decisions needed before any feature screen.
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0

  # Audio playback (core/playback) — real playback engine, playing
  # real narration fetched from the backend TTS proxy (core/tts,
  # ADR-0007) rather than a bundled placeholder.
  just_audio: ^0.9.40

  # Auth (core/config/supabase_config.dart, ADR-0006) — talks directly
  # to Supabase for email/password sign-in/up. Session persistence is
  # handled internally by this package (secure local storage), so no
  # separate flutter_secure_storage dependency is needed for that.
  supabase_flutter: ^2.8.0

  # Backend TTS proxy client (core/tts, ADR-0007) — a single POST call
  # with a bearer token, nothing dio's larger feature set would help
  # with here.
  http: ^1.2.0

  # Synthesized audio is written to a temp file for just_audio to play
  # (core/tts/tts_client.dart) — the standard way to get a platform-
  # correct temp directory across iOS/Android/desktop.
  path_provider: ^2.1.0

  # --- Not yet added; documented here as the anticipated set. ---
  # Add via `flutter pub add <package>` when each feature is actually built,
  # rather than pre-installing unused dependencies.
  #
  # Offline TTS inference:  sherpa_onnx (or platform-channel bridge)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  # Uncomment and populate once font files are added under assets/fonts/
  # fonts:
  #   - family: Fraunces
  #     fonts:
  #       - asset: assets/fonts/Fraunces-Regular.ttf
  #       - asset: assets/fonts/Fraunces-SemiBold.ttf
  #         weight: 600
  #   - family: Manrope
  #     fonts:
  #       - asset: assets/fonts/Manrope-Regular.ttf
  #       - asset: assets/fonts/Manrope-Bold.ttf
  #         weight: 700
